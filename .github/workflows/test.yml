# Verify factory on every push to main, and on every PR.
#
# What goes wrong with these scripts is not a crash. `factory shift` runs
# unattended and its product is a log read hours later, so its worst output is a
# pass that could not see and said nothing — which reads exactly like a quiet
# night. `test/factory-shift.bats` stubs `gh`, `trill`, the after-merge hook,
# `factory-tier` and `date` so those passes are observable.
#
# `factory-tier` is the one whose output causes something with no
# undo-by-default, and its bad day is quieter still: a deny clause that stops
# matching has no symptom until a PR a person meant to see merges at 3 a.m.
# `test/factory-tier.bats` stubs `gh` and runs the real jq filter — a case per
# clause, each written so that deleting the clause fails it.
#
# `factory-watchdog` is the runner, and its silence is the loudest of all: it
# passes every twenty minutes while nobody is watching, decides which red
# branch gets a fixer lane, and revokes the lease when its passes stop landing.
# `test/factory-watchdog.bats` stubs `factory-shift` with a scripted event
# stream, writes lease files and ages logs directly, so every gate and every
# stall shape is observable on a runner in seconds.
#
# `factory-lease` was only ever reached as somebody else's fixture — a grant to
# start the runner above, a lease file written directly, a `chmod -x` to make
# `doctor` report it missing — so nothing had handed `grant` a duration nobody
# would type. `test/factory-lease.bats` is the verb's own, and its subject is
# the same shape as the three above: a grant that prints ✓ and is already
# expired is worse than one that crashes.
#
# `skill install` is the one verb a haus machine never calls — `haus.ai.skill`
# puts those files there — so it is only ever run by a stranger, once, and its
# failures were silent in five different ways: a flag with no value ended the
# verb with nothing on either stream, an empty one installed into every client
# on the machine, a read-only client directory abandoned every client after it,
# a tree with no skills reported a zero as though zero had been asked for, and
# `cp` inheriting a 444 store file made every installed copy read-only for the
# next run to refuse. That last one is why the fixture's `ai/` is chmod'd
# read-only in setup: taken from a writable checkout it is 644, and the case
# would stay green against the tree this repo actually ships.
# `test/agent-surface.bats` covers the verb beside `config` and `doctor`,
# because the question is the same one: what the dispatcher does with an
# argument nobody would type.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — a runner the next PR then waits
# behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ONE job, and measured that way rather than assumed. The arithmetic is here
  # so the next reader does not redo it.
  #
  # Five PR runs, read 2026-09-16: the job is 129s and its `bats` step is 118s
  # of that. Every other step is 4s or less, and the ~11s left over is what a
  # Linux job costs around the steps that do its work.
  #
  # The step's own anatomy, from the per-line timestamps in
  # `gh api repos/hausfold/factory/actions/jobs/<id>/logs` (means of the five):
  #
  #     factory-watchdog  88s      agent-surface   7s
  #     factory-shift     11s      factory-lease   3s
  #     factory-tier       7s      presentation    1s
  #
  # The need boundary this step list already carries is the snug checkout
  # above, which only `agent-surface` and `presentation` read. Cut there, the
  # painter half is 9s of bats and the half left behind is 110s — a 121s job
  # against today's 129s. Eight seconds, for a whole extra runner request, and
  # it fails both tests a split has to pass: the painter half is under the ~11s
  # a job costs, so it has not earned one and joins this one; and 8s is the
  # whole of a 100s spread, which is all a split is ever worth.
  #
  # So there is nothing to group, and the 122s is `test/factory-watchdog.bats`:
  # 88s, three quarters of the step. 55s of that 88 is wall clock ON PURPOSE.
  #
  #   - 36s is the two `⚠ … suspend …` cases. They stub `sleep` so the clock
  #     jumps, because awake-seconds and wall-seconds can only be told apart by
  #     letting the wall clock pass. The tell that this is a clock and not a
  #     cost: a Mac 2.8x slower than the runner on every other suite runs those
  #     two in 35s against the runner's 36.
  #   - 19s is seven `sleep 2`/`sleep 3` waits proving nothing MORE was logged.
  #     A wait for an absence cannot poll.
  #
  # Both sets of numbers were tuned against failures on loaded machines, and
  # the comment at each case says which failure. Shortening them buys seconds
  # and spends flakes. The remaining ~33s is 61 cases forking, spread evenly —
  # nothing to lift out.
  #
  # One thing this gate does NOT have, checked because haus did: no step is
  # held open past its last `ok`. Summed per-case timestamps come to 118.1s
  # against the step's own 117.8s, so nothing detached here outlives the
  # harness still holding its descriptor. `fake_runner`'s `sleep 30` is the
  # candidate; it is killed.
  test:
    name: bats + shellcheck + skill guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bats is the one tool of the three the ubuntu-latest image lacks, and
      # npm is preinstalled, so it comes from npm rather than apt. shellcheck
      # and jq are already on the image; `apt-get update` in front of them
      # bought nothing and, on the day the Azure mirrors go quiet, hangs rather
      # than fails (haus/check.yml has the long version of that afternoon).
      #
      # jq is still named rather than assumed: the tier filter IS a jq program
      # and the config layer is another, so an image that dropped it would turn
      # every case into an error rather than a failure. The version print below
      # is what makes that loud instead of confusing.
      - name: Install bats
        run: sudo npm install -g bats
      - name: jq is on this image
        run: jq --version

      # The versions are printed because they are not pinned, and apt's
      # shellcheck disagrees with a newer one about which checks are on by
      # default. When this step reddens on a line nobody touched, the version is
      # the first thing to read.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x bin/factory libexec/factory-lease libexec/factory-shift \
            libexec/factory-tier libexec/factory-watchdog lib/common.sh lib/ui.sh \
            script/check-skills.sh

      # The same script nix/skill.nix runs, over the same discovered set: a
      # skill with broken frontmatter installs, lists and is never loaded, so
      # the failure has to be a build failure somewhere that runs without Nix.
      - name: skill guards
        run: ./script/check-skills.sh ai factory

      # snug's bash half is the painter every report here draws through, and it
      # is a file rather than a service — so the presentation cases need the
      # file, not the binary and not Nix. Without it they `skip`, which would
      # leave the painted contract unexercised on the one machine that runs
      # this on every push.
      #
      # At the REV flake.lock pins, never the default branch. Taking snug's main
      # would red a factory PR that touched nothing the day snug changes a
      # contract, and — worse in the other direction — would leave the rev this
      # tool actually ships against never exercised.
      - name: resolve snug's pinned rev
        id: snug
        run: echo "rev=$(jq -r '.nodes.snug.locked.rev' flake.lock)" >>"$GITHUB_OUTPUT"

      - name: check out snug (the presentation runtime)
        uses: actions/checkout@v4
        with:
          repository: hausfold/snug
          ref: ${{ steps.snug.outputs.rev }}
          path: .snug

      # Exported for the WHOLE suite, not just the presentation cases: shipped,
      # every report is painted, so that is the shape the rest of the suite
      # should be reading. `test/presentation.bats` unsets it inside its own
      # setup, so its no-painter cases still test the degraded path.
      - name: bats
        run: |
          bats --version
          FACTORY_UI_SH="$PWD/.snug/share/ui.sh" bats test/
